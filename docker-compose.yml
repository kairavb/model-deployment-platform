services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform}
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiplatform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-platform-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./storage/models:/storage/models
      - ./storage/builds:/storage/builds
      - ./storage/prometheus:/storage/prometheus
    environment:
      MODEL_STORAGE_PATH: /storage/models
      DEPLOYMENT_BUILD_PATH: /storage/builds
      PROMETHEUS_TARGETS_PATH: /storage/prometheus/inference_targets.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: ai-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ai-platform-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-platform-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ai-platform-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai-platform-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./storage/prometheus:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - ai-platform-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ai-platform-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ai-platform-net

networks:
  ai-platform-net:
    name: ai-platform-net
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
