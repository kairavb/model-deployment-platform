global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ai-platform-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: "ai-platform-inference"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/inference_targets.json
        refresh_interval: 30s
