[project]
name = "deployment-engine"
version = "0.1.0"
description = "Docker-based deployment engine for AI Platform"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["deployment_engine*"]
